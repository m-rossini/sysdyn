version: "1"
model:
  id: hp-teams
  title: High-Performance Team (v4)
  description: >-
    The people layer on top of the v3 delivery system: staff with hiring and
    attrition (capability is a per-person average, newcomers ramp up slowly
    and need mentoring — the J-curve), leadership trust (slow to build, fast
    to collapse; gates training and taxes autonomy), and team cohesion
    (handoff loss, mentoring quality, onboarding speed).
  time:
    start: 0
    stop: 52
    dt: 0.5
    unit: week
  parameters:
    - name: base_capacity
      value: 30
      unit: work/week
      description: >-
        Throughput ceiling at full capability and full energy. Delivery ramps up as
        the WIP buffer fills, then capability and energy gains lift it further.
      concept: parameter
    - name: incoming_rate
      value: 8
      unit: work/week
      description: New work arriving per week.
      concept: parameter
    - name: learning_rate
      value: 0.25
      unit: 1/week
      description: Fraction of finished work converted into capability gains.
      concept: parameter
    - name: burnout_rate
      value: 0.25
      unit: points/work
      description: >-
        Energy consumed per unit of throughput. Chosen together with recovery_rate so
        energy settles near 45-55 under sustained load rather than collapsing or
        saturating at 100.
      concept: parameter
    - name: recovery_rate
      value: 0.04
      unit: 1/week
      description: Rate at which the energy gap (100 - energy) is restored.
      concept: parameter
    - name: wip_limit
      value: 20
      unit: work
      description: >-
        Work-in-progress level the team sustains without congestion. Starting more
        than this slows finishing via the congestion auxiliary.
      concept: parameter
    - name: pull_rate
      value: 0.2
      unit: 1/week
      description: >-
        Aggressiveness of pulling backlog into progress. Throttled to zero as
        in-progress work approaches 1.6x the WIP limit.
      concept: parameter
    - name: training_share
      value: 0.1
      unit: "1"
      description: >-
        Share of team time invested in formal learning (trainings, conferences,
        books, labs). Diverted from delivery: it lowers current capacity.
      concept: parameter
    - name: training_effectiveness
      value: 0.5
      unit: "1"
      description: >-
        How well learning investment converts into capability (quality of
        trainings, books, labs). Scales the training flow.
      concept: parameter
    - name: debt_rate
      value: 0.22
      unit: points/work
      description: Debt points accrued per unit of finished work under pressure.
      concept: parameter
    - name: paydown_rate
      value: 0.15
      unit: 1/week
      description: Rate at which debt is paid down when pressure is low.
      concept: parameter
    - name: pressure_horizon
      value: 12
      unit: week
      description: Weeks of queued work the team absorbs before feeling pressure.
      concept: parameter
    - name: staff_target
      value: 5
      unit: people
      description: Headcount the team hires toward. Raise it to grow the team.
      concept: parameter
    - name: hire_delay
      value: 4
      unit: week
      description: Weeks to close the gap between target and actual headcount.
      concept: parameter
    - name: attrition_rate
      value: 0.01
      unit: 1/week
      description: Base weekly fraction of staff leaving; doubled when energy is drained.
      concept: parameter
    - name: ramp_time
      value: 6
      unit: week
      description: Weeks for a new hire to become fully effective.
      concept: parameter
    - name: mentor_fraction
      value: 0.5
      unit: "1"
      description: Share of a newcomer's gap that seniors pay as mentoring load.
      concept: parameter
    - name: trust_build_rate
      value: 0.8
      unit: points/week
      description: Max weekly trust gain when delivery meets promises. Slow by design.
      concept: parameter
    - name: trust_erosion_rate
      value: 2.5
      unit: points/week
      description: Max weekly trust loss on misses; faster than building, but slow enough to forgive transients.
      concept: parameter
    - name: cohesion_build_rate
      value: 1.5
      unit: points/week
      description: Max weekly cohesion gain from delivering together.
      concept: parameter
    - name: cohesion_churn_rate
      value: 10
      unit: points
      description: Cohesion cost per full team turnover equivalent.
      concept: parameter
    - name: conflict_rate
      value: 0.5
      unit: points/week
      description: Weekly cohesion loss per unit of schedule pressure above 1.
      concept: parameter
  stocks:
    - name: backlog
      initial: 80
      unit: work
      inflows: [new_work]
      outflows: [start_work]
      description: Work waiting to be started.
      concept: stock
    - name: in_progress
      initial: 0
      unit: work
      inflows: [start_work]
      outflows: [finish_work]
      description: >-
        Work started but not yet delivered. The WIP buffer decouples arrivals
        from delivery; too much of it congests the team.
      concept: stock
    - name: delivered
      initial: 0
      unit: work
      inflows: [finish_work]
      description: Cumulative work delivered.
      concept: stock
    - name: capability_total
      initial: 200
      unit: points
      inflows: [learning, training]
      description: >-
        Total team skill and knowledge. Per-person capability is
        capability_total / staff, so hiring dilutes the average.
      concept: stock
    - name: energy
      initial: 60
      unit: points
      inflows: [recovery]
      outflows: [burnout]
      description: Team energy and morale, on a 0-100 scale.
      concept: stock
    - name: tech_debt
      initial: 10
      unit: points
      inflows: [debt_accrual]
      outflows: [debt_paydown]
      description: >-
        Accumulated shortcuts and unfinished quality work. Consumes capacity
        as rework; paid down when pressure is low.
      concept: stock
    - name: staff
      initial: 5
      unit: people
      inflows: [hiring]
      outflows: [attrition]
      description: Team headcount. Hires toward staff_target; leaves faster when energy is drained.
      concept: stock
    - name: trust
      initial: 60
      unit: points
      inflows: [trust_gain]
      outflows: [trust_loss]
      description: >-
        Leadership confidence, 0-100. Builds slowly on kept promises, collapses
        fast on misses and visible burnout. Gates training time and autonomy.
      concept: stock
    - name: cohesion
      initial: 60
      unit: points
      inflows: [cohesion_gain]
      outflows: [cohesion_loss]
      description: >-
        Social capital, 0-100. Built by delivering together; burned by churn
        and conflict under pressure. Carries mentoring and handoff quality.
      concept: stock
  auxiliaries:
    - name: capacity
      equation: "base_capacity * capability / 100 * (1 - training_share_eff) * effective_staff / max(staff, 0.5) * autonomy_factor * (1 - mentoring_load)"
      unit: work/week
      description: >-
        Throughput ceiling: per-person capability times effective headcount,
        net of training time, autonomy tax and mentoring load.
      concept: auxiliary
    - name: capability
      equation: "capability_total / max(staff, 0.5)"
      unit: points
      description: Average per-person capability. Diluted by hiring, grown by learning.
      concept: auxiliary
    - name: promised_rate
      equation: "incoming_rate"
      unit: work/week
      description: "Delivery rate leadership expects: keeping up with arrivals."
      concept: auxiliary
    - name: effective_staff
      equation: "smooth(staff, ramp_time, 5)"
      unit: people
      description: Fully-effective headcount; lags hires by the ramp time.
      concept: auxiliary
    - name: autonomy_factor
      equation: "1 - 0.15 * max(0, 60 - trust) / 60"
      unit: "1"
      description: Capacity tax from low-trust overhead (reports, approvals).
      concept: auxiliary
    - name: training_share_eff
      equation: "training_share * trust / 60"
      unit: "1"
      description: "Effective training time: low trust squeezes learning out."
      concept: auxiliary
    - name: mentoring_load
      equation: "mentor_fraction * max(0, staff - effective_staff) / max(staff, 0.5)"
      unit: "1"
      description: Share of senior capacity spent bringing newcomers up to speed.
      concept: auxiliary
    - name: energy_factor
      equation: "energy / 100"
      unit: "1"
      description: Share of capacity available at the current energy level.
      concept: auxiliary
    - name: focus
      equation: "in_progress / (in_progress + 10)"
      unit: "1"
      description: >-
        Share of nominal capacity that has work in hand to act on. It approaches 1
        once the WIP buffer is filled and goes to 0 when no work is in progress.
      concept: auxiliary
    - name: congestion
      equation: "wip_limit / (wip_limit + max(0, in_progress - wip_limit) / 2)"
      unit: "1"
      description: >-
        Delivery penalty from excess WIP: 1 at or below the WIP limit, decaying
        gently above it. Models context-switching and queueing overhead.
      concept: auxiliary
    - name: effective_throughput
      equation: "capacity * energy_factor * focus * congestion * (1 - rework_share)"
      unit: work/week
      description: Actual delivery rate after energy, work-in-hand, congestion and rework limits.
      concept: auxiliary
    - name: schedule_pressure
      equation: "(backlog + in_progress) / (max(finish_work, 0.5) * pressure_horizon)"
      unit: "1"
      description: >-
        Queued work in weeks of current finishing rate, over the absorbed
        horizon. Above 1 the team feels pressure and takes shortcuts.
      concept: auxiliary
    - name: rework_share
      equation: "tech_debt / (tech_debt + 60) * (1 + 0.5 * (60 - cohesion) / 100)"
      unit: "1"
      description: Share of effective capacity consumed reworking past shortcuts; worse when cohesion is low.
      concept: auxiliary
  flows:
    # Pull loop: backlog -> in_progress -> delivered. Starting more than the
    # WIP limit congests finishing, so excess starts slow completions.
    - name: start_work
      equation: "pull_rate * backlog * max(0, 1 - in_progress / (wip_limit * 1.6))"
      from: backlog
      to: in_progress
      unit: work/week
      description: Work pulled from backlog into progress, throttled near 1.6x the WIP limit.
      concept: flow
    # Reinforcing loop: more finishing -> more learning -> more capability ->
    # more capacity -> more effective throughput.
    - name: finish_work
      equation: "effective_throughput"
      from: in_progress
      to: delivered
      unit: work/week
      description: Work completed and moved from in-progress to delivered.
      concept: flow
    - name: learning
      equation: "learning_rate * finish_work * (1 - capability / 100) * staff"
      to: capability_total
      unit: points/week
      description: Team learning-by-doing; scales with headcount, saturating per-person at 100.
      concept: flow
    - name: training
      equation: "training_effectiveness * training_share_eff * base_capacity * (1 - capability / 100) * (1 + 0.5 * (cohesion - 60) / 100) * staff"
      to: capability_total
      unit: points/week
      description: Team formal learning; scales with headcount. Needs trust (time) and cohesion (mentoring quality).
      concept: flow
    - name: hiring
      equation: "max(0, staff_target - staff) / hire_delay"
      to: staff
      unit: people/week
      description: Hires toward the headcount target.
      concept: flow
    - name: attrition
      equation: "staff * attrition_rate * (1 + max(0, 60 - energy) / 30)"
      from: staff
      unit: people/week
      description: People leaving; faster when energy is drained.
      concept: flow
    - name: trust_gain
      equation: "trust_build_rate * min(1, finish_work / max(promised_rate, 0.5)) * max(0, 1 - trust / 100)"
      to: trust
      unit: points/week
      description: Slow trust buildup on kept promises, saturating at 100.
      concept: flow
    - name: trust_loss
      equation: "(trust_erosion_rate * max(0, 1 - finish_work / max(promised_rate, 0.5)) + trust_erosion_rate * 0.5 * max(0, 60 - energy) / 60) * trust / 100"
      from: trust
      unit: points/week
      description: Fast trust collapse on misses and visible burnout; proportional, so trust floors at zero.
      concept: flow
    - name: cohesion_gain
      equation: "cohesion_build_rate * min(1, finish_work / max(promised_rate, 0.5)) * max(0, 1 - cohesion / 100)"
      to: cohesion
      unit: points/week
      description: Slow cohesion buildup from delivering together.
      concept: flow
    - name: cohesion_loss
      equation: "(cohesion_churn_rate * (hiring + attrition) / max(staff, 0.5) + conflict_rate * max(0, schedule_pressure - 1)) * cohesion / 100"
      from: cohesion
      unit: points/week
      description: Cohesion burned by churn and conflict under pressure; proportional, so cohesion floors at zero.
      concept: flow
    # Debt loop: pressure breeds shortcuts, shortcuts accrue debt, debt
    # consumes capacity as rework, less capacity raises pressure.
    - name: debt_accrual
      equation: "debt_rate * finish_work * schedule_pressure / (schedule_pressure + 2)"
      to: tech_debt
      unit: points/week
      description: Shortcuts accrued doing work under schedule pressure.
      concept: flow
    - name: debt_paydown
      equation: "paydown_rate * tech_debt * 2 / (schedule_pressure + 2)"
      from: tech_debt
      unit: points/week
      description: Debt retired when pressure is low enough to invest in quality.
      concept: flow
    # Balancing loop: more finishing -> more burnout -> less energy -> lower
    # energy factor -> less effective throughput.
    - name: burnout
      equation: "burnout_rate * finish_work"
      from: energy
      unit: points/week
      description: Energy spent sustaining the delivery rate.
      concept: flow
    - name: recovery
      equation: "recovery_rate * (100 - energy)"
      to: energy
      unit: points/week
      description: Energy restored when below the 100-point ceiling.
      concept: flow
    - name: new_work
      equation: "incoming_rate"
      to: backlog
      unit: work/week
      description: New work arriving into the backlog.
      concept: flow
