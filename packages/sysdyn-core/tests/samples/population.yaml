version: "1"
model:
  id: population
  title: Simple Population
  description: Basic stock and flow model with births and deaths.
  time:
    start: 0
    stop: 50
    dt: 1
  parameters:
    - name: birth_rate
      value: 0.04
      unit: 1/year
    - name: average_lifetime
      value: 25
      unit: year
  stocks:
    - name: population
      initial: 100
      unit: people
      inflows: [births]
      outflows: [deaths]
      concept: stock
  flows:
    - name: births
      equation: "birth_rate * population"
      to: population
      unit: people/year
      concept: flow
    - name: deaths
      equation: "population / average_lifetime"
      from: population
      unit: people/year
      concept: flow
